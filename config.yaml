# Job Hunter Bot configuration.
# Edit this file to change what the bot looks for. No code changes needed.

# Regions. A job's location is matched (case-insensitive substring) against
# these lists; the first region that matches wins. Jobs anywhere in Israel are
# kept, and the region is used for filtering in the app and for scoring.
regions:
  south:
    label: "דרום"
    places: [beer sheva, be'er sheva, beersheba, beer-sheva, ashkelon, ashdod, sderot, netivot, kiryat gat,
             ofakim, dimona, arad, eilat, yeruham, kiryat malachi, gan yavne, yavne,
             באר שבע, אשקלון, אשדוד, שדרות, נתיבות, קרית גת, קריית גת, אופקים, דימונה, ערד, אילת, ירוחם, יבנה]
  center:
    label: "מרכז"
    places: [tel aviv, tel-aviv, gush dan, ramat gan, givatayim, herzliya, petah tikva, petach tikva, holon,
             bnei brak, bat yam, rishon, rehovot, ness ziona, nes ziona, raanana, ra'anana, kfar saba,
             hod hasharon, netanya, modiin, modi'in, lod, ramla, rosh haayin, rosh ha'ayin, yehud, airport,
             or yehuda, kiryat ono, jerusalem, beit shemesh, shoham, be'er ya'akov,
             תל אביב, רמת גן, גבעתיים, הרצליה, פתח תקווה, פתח תקוה, חולון, בני ברק, בת ים, ראשון לציון,
             רחובות, נס ציונה, רעננה, כפר סבא, הוד השרון, נתניה, מודיעין, לוד, רמלה, ראש העין, יהוד,
             קרית אונו, ירושלים, בית שמש, שוהם, באר יעקב]
  north:
    label: "צפון"
    places: [haifa, yokneam, yoqneam, nazareth, karmiel, tiberias, afula, nahariya, akko, acre, caesarea,
             hadera, migdal haemek, kiryat shmona, zichron, matam,
             חיפה, יקנעם, נצרת, כרמיאל, טבריה, עפולה, נהריה, עכו, קיסריה, חדרה, מגדל העמק, קרית שמונה, זכרון]

# A location that only says "Israel" (no city) or remote is kept, with region "any".
accept_country_only: true

# Role tracks. A job is tagged with the first track whose keywords appear in its title.
tracks:
  qa:
    label: "QA / Testing"
    keywords: [qa, quality assurance, tester, testing, test engineer, test automation, verification, validation, בודק תוכנה, בודקת תוכנה, בודק/ת תוכנה, בדיקות תוכנה, בדיקות QA]
  support:
    label: "Tech Support / IT"
    keywords: [support, helpdesk, help desk, service desk, it technician, it specialist, it administrator, noc, system administrator, sysadmin, technical operations, תמיכה, תומך, תומכ, טכנאי, הלפדסק, מחשבים]
  dev:
    label: "Development"
    keywords: [developer, software engineer, software developer, programmer, full stack, fullstack, backend, back-end, frontend, front-end, data engineer, data analyst, python, java, c++, מפתח, פיתוח, תוכנה, תוכניתן]
  tech:
    label: "Tech (other)"
    # Broad tech words. Not in junior_tracks/possible_tracks, so only student positions use it.
    keywords: [engineer, engineering, security, cyber, cloud, devops, monitoring, network, it, algorithm, research, ai, ml, sre, סייבר, הנדסה]

# Fields used only to label jobs that arrive via alert emails (no seniority filter).
general_fields:
  security:
    label: "אבטחה"
    keywords: [מאבטח, מאבטחת, אבטחה, שמירה, שומר, שומרת, סייר, סיירת, קב"ט, security guard, guard]
  lifeguard:
    label: "הצלה"
    keywords: [מציל, מצילה, הצלה, lifeguard]
  government:
    label: "שירות המדינה"
    keywords: [מכרז, שירות המדינה, נציבות, רשות המסים, מכס, בודק מכס, בודקת מכס, כלבן, כלבנית, כלבנות, בודק מטענים, בודקת מטענים, בידוק, משרד ה, ממשלתי, ממשלתית, משרד הביטחון]
  office:
    label: "משרדי"
    keywords: [מזכיר, מזכירה, אדמיניסטרציה, אדמיניסטרטיבי, משרד, פקיד, פקידה, office, admin, back office]

# Title words that mark a job as student / entry level.
student_keywords: [student, intern, internship, סטודנט, סטודנטית, משרת סטודנט]
junior_keywords: [junior, entry level, entry-level, graduate, ג'וניור, גוניור, ללא ניסיון]

# Title words that disqualify a job.
exclude_keywords: [senior, sr, expert, experienced, lead, principal, staff, manager, head of, director, architect, vp, team leader, בכיר, ראש צוות, מנהל]

# Rule: student jobs in any track always match.
#
# Junior jobs match only when they are in qa or support (dev junior roles usually want experience).
junior_tracks: [qa, support]

# "Possible fit": QA / support titles with no seniority marker at all
# (e.g. "IT Support Specialist"). Often open to students; sent with a separate label.
possible_tracks: [qa, support]

# Relay the official "smart agent" alert emails from job sites that don't allow
# scraping (security, lifeguard and other general jobs). Read-only Gmail access
# via the GMAIL_ADDRESS + GMAIL_APP_PASSWORD secrets; skipped when they're missing.
email_alerts:
  enabled: true
  senders: [alljobs.co.il, drushim.co.il, jobmaster.co.il]
  lookback_days: 3
  max_jobs_per_email: 10

# The mini app (GitHub Pages). Linked from every 🔥 alert.
app_url: https://ayal1206-hub.github.io/job-hunter-bot/

