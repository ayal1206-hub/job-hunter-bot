name: Scan for jobs

on:
  schedule:
    # Times are UTC (Israel = UTC+2 in winter, UTC+3 in summer).
    # Chosen from when new jobs actually appeared in the week of 16-23 Nov 2026 (board posts
    # and AllJobs emails): ~90% between 09:00 and 21:00 Israel time, peaks 09-12, 14 and 18.
    # Hourly through the day, once at night. GitHub skips some scheduled runs under load,
    # so frequent attempts also make the real schedule more reliable.
    - cron: "50 5-19 * * *"   # 07:50-21:50 Israel (winter), hourly
    - cron: "50 22 * * *"     # 00:50 Israel: the evening's late posts
  workflow_dispatch:
    inputs:
      check:
        description: "Only report boards and scores (no alerts, no app update)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check boards
        if: ${{ inputs.check }}
        run: python -m jobbot.main --check

      - name: Save check report
        if: ${{ inputs.check }}
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Update check report [skip ci]"
          git push

      - name: Scan, score and alert on 🔥 jobs
        if: ${{ !inputs.check }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobbot.main

      - name: Save state
        if: ${{ !inputs.check }}
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add seen.json docs/jobs.json data/facts.json
          git diff --cached --quiet || git commit -m "Update jobs [skip ci]"
          git push

      - name: Package the app
        if: ${{ !inputs.check }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    # Publishes docs/ (the Telegram mini app + jobs.json) to GitHub Pages.
    needs: scan
    if: ${{ !inputs.check }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
