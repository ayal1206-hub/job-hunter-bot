name: Scan for jobs

on:
  schedule:
    # Every 4 hours (UTC). GitHub may delay scheduled runs by a few minutes.
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      check:
        description: "Only check which job boards work (no alerts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check boards
        if: ${{ inputs.check }}
        run: python -m jobbot.main --check

      - name: Scan and send alerts
        if: ${{ !inputs.check }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobbot.main

      - name: Remember sent jobs
        if: ${{ !inputs.check }}
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
